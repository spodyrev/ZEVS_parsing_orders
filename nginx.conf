# Конфигурация Nginx для MySyte
# Разместите этот файл в /etc/nginx/sites-available/mysyte
# и создайте символическую ссылку в /etc/nginx/sites-enabled/

# HTTP сервер - перенаправление на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Для Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Перенаправление всех HTTP запросов на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;
    
    # SSL сертификаты (будут созданы с помощью Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL настройки (рекомендуемые для безопасности)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Дополнительные заголовки безопасности
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Логи
    access_log /var/log/nginx/mysyte_access.log;
    error_log /var/log/nginx/mysyte_error.log;
    
    # Максимальный размер загружаемых файлов (для фото со склада)
    client_max_body_size 50M;
    
    # Proxy к FastAPI приложению
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Заголовки для корректной работы с WebSocket и proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeout настройки
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Отключаем буферизацию для streaming responses
        proxy_buffering off;
    }
    
    # Статические файлы (CSS, JS, изображения)
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        
        # Кэширование статических файлов
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Кэширование для изображений товаров
    location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Блокировка доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Дополнительная конфигурация для production
# Ограничение скорости запросов (защита от DDoS)
limit_req_zone $binary_remote_addr zone=mysyte_limit:10m rate=10r/s;
limit_req zone=mysyte_limit burst=20 nodelay;
