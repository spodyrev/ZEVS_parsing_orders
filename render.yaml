services:
  # Web приложение FastAPI
  - type: web
    name: mysyte-web
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DATABASE_URL
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://mysyte-web.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        fromService:
          type: web
          name: mysyte-web
          property: port
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
