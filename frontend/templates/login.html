<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - ZEVS</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Наши стили -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 50px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        
        .company-logo-login {
            height: 60px;
            margin-bottom: 20px;
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .login-subtitle {
            font-size: 16px;
            color: #718096;
            margin-bottom: 40px;
        }
        
        .telegram-login-wrapper {
            margin: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }
        
        .security-note {
            font-size: 14px;
            color: #718096;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
        }
        
        .security-note i {
            color: #48bb78;
            margin-right: 5px;
        }
        
        .feature-list {
            text-align: left;
            margin-top: 30px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #4a5568;
        }
        
        .feature-item i {
            color: #667eea;
            margin-right: 12px;
            font-size: 18px;
            width: 20px;
        }
        
        .loading-message {
            display: none;
            margin-top: 20px;
            color: #718096;
            font-size: 14px;
        }
        
        .loading-message.show {
            display: block;
        }
        
        .error-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fed7d7;
            color: #c53030;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Логотип компании -->
        <img src="/static/images/zevs-logo.png" alt="ZEVS" class="company-logo-login">
        
        <!-- Заголовок -->
        <h1 class="login-title">Система отслеживания заказов</h1>
        <p class="login-subtitle">Войдите с помощью Telegram для доступа</p>
        
        <!-- Telegram Login Widget -->
        <div class="telegram-login-wrapper">
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="ZEVS_Parsing_orders_bot" 
                    data-size="large" 
                    data-radius="10"
                    data-auth-url="{{ request.url_for('telegram_callback') }}"
                    data-request-access="write"></script>
        </div>
        
        <!-- Сообщение о загрузке -->
        <div class="loading-message" id="loadingMessage">
            <i class="fas fa-spinner fa-spin"></i> Проверка авторизации...
        </div>
        
        <!-- Сообщение об ошибке -->
        <div class="error-message" id="errorMessage"></div>
        
        <!-- Преимущества -->
        <div class="feature-list">
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                <span>Безопасная авторизация через Telegram</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-box"></i>
                <span>Отслеживание заказов в реальном времени</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-warehouse"></i>
                <span>Управление складскими операциями</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-chart-line"></i>
                <span>Аналитика и отчеты</span>
            </div>
        </div>
        
        <!-- Примечание о безопасности -->
        <div class="security-note">
            <i class="fas fa-lock"></i>
            Доступ разрешен только авторизованным сотрудникам
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Проверка параметров в URL (для отображения ошибок)
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        
        if (error) {
            const errorMessage = document.getElementById('errorMessage');
            
            if (error === 'unauthorized') {
                errorMessage.textContent = 'Доступ запрещен. Ваш номер телефона не найден в системе. Обратитесь к администратору.';
            } else if (error === 'invalid_data') {
                errorMessage.textContent = 'Ошибка проверки данных от Telegram. Попробуйте еще раз.';
            } else if (error === 'auth_failed') {
                errorMessage.textContent = 'Ошибка авторизации. Попробуйте еще раз.';
            } else {
                errorMessage.textContent = 'Произошла ошибка. Попробуйте еще раз.';
            }
            
            errorMessage.classList.add('show');
        }
        
        // Показываем индикатор загрузки после клика на Telegram кнопку
        // (это необязательно, но улучшает UX)
        document.addEventListener('DOMContentLoaded', function() {
            // Ждем появления Telegram iframe
            const checkIframe = setInterval(() => {
                const iframe = document.querySelector('iframe[src*="telegram"]');
                if (iframe) {
                    clearInterval(checkIframe);
                    
                    // При клике на iframe показываем индикатор загрузки
                    iframe.addEventListener('click', () => {
                        document.getElementById('loadingMessage').classList.add('show');
                    });
                }
            }, 100);
        });
    </script>
</body>
</html>
